# Builds ShapeRunner for Windows, macOS and Linux. Runs when a version
# tag (v10.0, v10.1, ...) is pushed, or by hand from the Actions tab.
# Each finished app is attached to the run as a download.
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: ShapeRunner-windows.zip
          - os: macos-latest
            package: ShapeRunner-macos.zip
          - os: ubuntu-22.04        # older glibc, so the app runs on more distros
            package: ShapeRunner-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PortAudio to bundle (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install Python packages
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm ShapeRunner.spec

      # Linux: remove the system PortAudio first, so the test proves the
      # copy bundled in the app is the one that loads
      - name: Self-test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) dist/ShapeRunner/ShapeRunner-terminal.exe --selftest ;;
            macOS)   dist/ShapeRunner.app/Contents/MacOS/ShapeRunner --selftest ;;
            Linux)   sudo apt-get remove -y libportaudio2
                     dist/ShapeRunner/ShapeRunner --selftest ;;
          esac

      - name: Package
        shell: bash
        run: |
          cd dist
          case "$RUNNER_OS" in
            Windows) 7z a "../${{ matrix.package }}" ShapeRunner ;;
            macOS)   ditto -c -k --keepParent ShapeRunner.app "../${{ matrix.package }}" ;;
            Linux)   tar czf "../${{ matrix.package }}" ShapeRunner ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.package }}
          archive: false

  # The beginner installer on a clean machine of each OS, then the terminal
  # version it set up runs for a few seconds without errors
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the installer
        run: python install.py

      - name: Run the terminal version it set up
        shell: bash
        run: |
          ls Run* run_* 2>/dev/null || true    # the launcher it made
          script=$(ls shapes_v*.py)            # only the current version is in the repo
          case "$RUNNER_OS" in
            Windows) py=.venv/Scripts/python.exe ;;
            *)       py=.venv/bin/python ;;
          esac
          "$py" - "$script" <<'EOF'
          import subprocess, sys
          p = subprocess.Popen([sys.executable, sys.argv[1], "--terminal"],
                               stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          try:
              out, err = p.communicate(timeout=5)
          except subprocess.TimeoutExpired:
              p.kill()
              out, err = p.communicate()
          frames = out.count(b"\x1b[H")
          print(sys.argv[1], "frames drawn:", frames)
          print(err.decode(errors="replace"))
          sys.exit(0 if frames > 20 and b"Traceback" not in err else 1)
          EOF
